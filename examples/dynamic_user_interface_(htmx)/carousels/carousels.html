<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Carousel Component</title>
</head>
<body>
  <div class="carousel">
    <div class="carousel-item active">
      <img src="{{ image_urls[0] }}" alt="Image 1">
    </div>
    <div class="carousel-item">
      <img src="{{ image_urls[1] }}" alt="Image 2">
    </div>
    <div class="carousel-item">
      <img src="{{ image_urls[2] }}" alt="Image 3">
    </div>
    <button class="carousel-control prev" hx-get="/carousel/prev">Previous</button>
    <button class="carousel-control next" hx-get="/carousel/next">Next</button>
  </div>
  <script>
    // Javascript logic for carousel navigation and transitions
  </script>
</body>
</html>
